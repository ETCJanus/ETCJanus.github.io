<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Gym Log</title>
    <meta name="description" content="Persoonlijk trainingslogboek: sets, reps, gewicht en lichaamsgewicht.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="dark">

    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#121417">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Gym Log">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <!-- Lettertypes staan in de app zelf (fonts/), zodat ze ook zonder bereik in de gym werken. -->
    <link rel="preload" href="fonts/big-shoulders.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
    <!-- Hoog de ?v= op bij elke wijziging aan style.css/config.js/script.js. -->
    <link rel="stylesheet" href="style.css?v=31">
</head>
<body>

    <header class="top">
        <div class="kop" id="kop"></div>
        <span class="sync" id="sync" role="status"></span>
    </header>

    <main class="wrap" id="app">
        <div class="laden" role="status">Laden…</div>
    </main>

    <nav class="tabs" id="tabs" aria-label="Hoofdmenu" hidden></nav>

    <div id="sheet" hidden></div>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="config.js?v=2"></script>
    <script src="script.js?v=30"></script>
    <script src="fotos.js?v=21"></script>
    <script src="vrienden.js?v=2"></script>
</body>
</html>
